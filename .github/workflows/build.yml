name: Build
on: [push, pull_request]
permissions:
  contents: read
env:
  VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
  VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
jobs:
  web:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: integration-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run test:postgres
        env:
          TOVARIX_TEST_POSTGRES: postgresql://postgres:integration-only@127.0.0.1:5432/postgres
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: tovarix-web
          path: dist
          if-no-files-found: error
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-35' 'build-tools;34.0.0'
      - run: npm ci
      - run: npm run android:sync
      - run: cd android && bash gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: tovarix-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
